name: Build OCR_Trigger.exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python make_icon.py
      - run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --uac-admin
          --name OCR_Trigger --icon icon.ico
          --collect-all customtkinter --collect-all rapidocr_onnxruntime
          --collect-all dxcam --collect-all comtypes
          --hidden-import pystray._win32 app.py
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: OCR_Trigger
          path: |
            dist/OCR_Trigger.exe
            dist/OCR_Trigger_Setup.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OCR_Trigger.exe
            dist/OCR_Trigger_Setup.exe
